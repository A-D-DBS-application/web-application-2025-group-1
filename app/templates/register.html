<!DOCTYPE html>
<html lang="en">
{% set page_title = 'Register' %}
{% set extra_css = '<style>
  :root {
    --homepage-bg-image: url("' + url_for('static', filename='img/Homepage.jpg') + '");
  }
</style>' %}
{% include 'partials/_head.html' %}
<body class="auth-page">

  <div class="container">
    <div class="logo">AG</div>
    <h1>Create an Account</h1>
    <p>Choose your account type to get started.</p>

    {% include 'partials/_flash_messages.html' %}

    <div class="choice-buttons">
      <a href="{{ url_for('main.register_traveller') }}" class="choice-btn">
        I'm a Traveller
      </a>
      <a href="{{ url_for('main.register_agency') }}" class="choice-btn">
        I'm an Agency
      </a>
    </div>

    <div class="register">
      Already have an account? <a href="{{ url_for('main.login') }}">Login here</a>
    </div>

    <p class="back-home" style="margin-top:15px;">
      <a href="{{ url_for('main.index') }}">← Back to Home</a>
    </p>
  </div>

</body>
</html>
