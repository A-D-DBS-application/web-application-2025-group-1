<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AfriGuide | Dashboard</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "Poppins", sans-serif; 
    }
    body {
      background: linear-gradient(135deg, #f4a261, #2a9d8f);
      display: flex; 
      justify-content: center; 
      align-items: center;
      height: 100vh; 
      color: #fff;
    }
    .container {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 16px;
      text-align: center;
      width: 400px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #264653;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn:hover { background: #1f3b47; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dashboard</h1>
    <p>Deze pagina is nog in opbouw 🚧</p>

    <a href="{{ url_for('main.logout') }}" class="btn">Uitloggen</a>
  </div>
</body>
</html>
