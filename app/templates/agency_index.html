<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfriGuide | Agency Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Poppins", sans-serif; }
    body {
      background: linear-gradient(135deg, #f4a261, #2a9d8f);
      display: flex; justify-content: center; align-items: center;
      height: 100vh; color: #fff;
    }
    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 16px;
      text-align: center;
      width: 400px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }
    .logo {
      width: 70px; height: 70px; background: #e9c46a; border-radius: 50%;
      margin: 0 auto 20px;
      display: flex; justify-content: center; align-items: center;
      font-weight: 700; color: #264653; font-size: 1.5rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .btn {
      display: block;
      background: #264653;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      margin: 10px 0;
      transition: 0.3s;
    }
    .btn:hover { background: #1f3b47; }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">AG</div>
    <h1>Agency Portal</h1>
    <p>Manage your activities and work with AfriGuide partners.</p>

    <a href="{{ url_for('main.agency_login') }}" class="btn">Login</a>
    <a href="{{ url_for('main.agency_register') }}" class="btn">Register</a>

    <p style="margin-top:20px;">
      <a href="{{ url_for('main.index') }}" style="color:white; text-decoration:underline;">
        ← Back to User Home
      </a>
    </p>
  </div>
</body>
</html>
