<!DOCTYPE html>
<html lang="en">
{% set page_title = 'Agency Login' %}
{% set extra_css = '<style>
  :root {
    --homepage-bg-image: url("' + url_for('static', filename='img/Homepage.jpg') + '");
  }
</style>' %}
{% include 'partials/_head.html' %}
<body class="auth-page">

  <div class="container">
    <div class="logo">AG</div>
    <h1>Agency Login</h1>
    <p>Access your agency dashboard to manage tours and bookings.</p>

    {% include 'partials/_flash_messages.html' %}

    <form method="POST" action="{{ url_for('main.agency_login') }}">
      <input type="email" name="email" placeholder="Agency Email" required>
      <button type="submit" class="btn">Login</button>
    </form>

    <div class="register">
      Don't have an agency account? <a href="{{ url_for('main.register_agency') }}">Register here</a>
    </div>

    <p class="back-home" style="margin-top:15px;">
      <a href="{{ url_for('main.index') }}">← Back to Home</a>
    </p>
  </div>

</body>
</html>
