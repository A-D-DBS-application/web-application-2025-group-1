<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfriGuide | Agency Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Poppins", sans-serif; }
    body {
      background: linear-gradient(135deg, #f4a261, #2a9d8f);
      display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff;
    }
    .container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 45px;
      border-radius: 16px;
      width: 370px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
    }
    .logo {
      width: 60px; height: 60px; background: #e9c46a; border-radius: 50%;
      margin: 0 auto 20px; display: flex; justify-content: center; align-items: center;
      font-weight: 700; color: #264653; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    input {
      width: 100%; padding: 10px; margin: 8px 0; border: none; border-radius: 8px; outline: none;
      background: rgba(255, 255, 255, 0.25); color: #fff;
    }
    button {
      width: 100%; padding: 10px; background: #264653; border: none; color: white;
      font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-top: 10px;
    }
    button:hover { background: #1f3b47; }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">AG</div>
    <h1>Agency Login</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash-message">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('main.agency_login') }}">
      <input type="email" name="email" placeholder="Agency Email" required>
      <button type="submit">Login</button>
    </form>

    <div class="register" style="margin-top: 18px; font-size: 0.9rem;">
      Don't have an agency account?
      <a href="{{ url_for('main.agency_register') }}" style="color: #fff; font-weight: 600; text-decoration: none;">
        Register here
      </a>
    </div>

    <p style="margin-top:15px;">
      <a href="{{ url_for('main.agency_index') }}" style="color:#fff;">← Back</a>
    </p>
  </div>
</body>
</html>
