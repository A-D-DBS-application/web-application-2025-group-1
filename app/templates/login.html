<!DOCTYPE html>
<html lang="en">
{% set page_title = 'Login' %}
{% set extra_css = '<style>
  :root {
    --homepage-bg-image: url("' + url_for('static', filename='img/Homepage.jpg') + '");
  }
</style>' %}
{% include 'partials/_head.html' %}
<body class="auth-page">

  <div class="container">
    <div class="logo">
      <img src="{{ url_for('static', filename='img/Logo Afriguide.png') }}" alt="AfriGuide Logo" style="width: 80px; height: 80px; object-fit: contain;">
    </div>
    <h1>Welcome</h1>
    <p>Log in to manage your travel plans or explore new destinations.</p>

    {% include 'partials/_flash_messages.html' %}

    <form method="POST" action="{{ url_for('main.login') }}">
      <input type="email" name="email" placeholder="Email address" required>
      <button type="submit" class="btn">Login</button>
    </form>

    <div class="register">
      Don't have an account? <a href="{{ url_for('main.register') }}">Register here</a>
    </div>

    <p class="back-home" style="margin-top:15px;">
      <a href="{{ url_for('main.index') }}">← Back to Home</a>
    </p>
  </div>

</body>
</html>
