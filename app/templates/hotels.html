<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AfriGuide | Hotels</title>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; font-family:"Poppins", sans-serif; }
    body { background: linear-gradient(135deg, #f4a261, #2a9d8f); color:#fff; padding:40px 0; display:flex; justify-content:center; }
    nav {
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
      padding: 10px 30px;
      display:flex; justify-content:space-between; align-items:center;
      border-radius:8px; margin-bottom:20px;
    }
    nav .logo { font-weight:700; font-size:1.3rem; }
    nav ul { list-style:none; display:flex; gap:20px; margin:0; padding:0; }
    nav ul li a { color:#fff; text-decoration:none; font-weight:600; transition:0.3s; }
    nav ul li a:hover { text-decoration:underline; }
    .container { background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); padding:30px; border-radius:16px; width:800px; box-shadow:0 8px 25px rgba(0,0,0,0.25); text-align:center; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <div class="logo">AfriGuide</div>
      <ul>
        <li><a href="{{ url_for('main.trips') }}">Trips</a></li>
        <li><a href="{{ url_for('main.activities') }}">Activities</a></li>
        <li><a href="{{ url_for('main.hotels') }}">Hotels</a></li>
        <li><a href="{{ url_for('main.agencies') }}">Agencies</a></li>
        <li><a href="{{ url_for('main.logout') }}">Logout</a></li>
      </ul>
    </nav>
    <h1>Dit is de Hotels pagina, nog in opbouw</h1>
  </div>
</body>
</html>
