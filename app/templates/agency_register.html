<!DOCTYPE html>
<html lang="en">
{% set page_title = 'Register as Agency' %}
{% set extra_css = '<style>
  :root {
    --homepage-bg-image: url("' + url_for('static', filename='img/Homepage.jpg') + '");
  }
</style>' %}
{% include 'partials/_head.html' %}
<body class="auth-page">

  <div class="container">
    <div class="logo">AG</div>
    <h1>Register as Agency</h1>
    <p>Join AfriGuide and start managing your activities and destinations.</p>

    {% include 'partials/_flash_messages.html' %}

    <form method="POST" action="{{ url_for('main.register_agency') }}">
      <input type="text" name="name" placeholder="Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="tel" name="phone_number" placeholder="Phone Number">

      <button type="submit" class="btn">Register</button>
    </form>

    <div class="register">
      Already have an account? <a href="{{ url_for('main.agency_login') }}">Login here</a>
    </div>

    <p class="back-home" style="margin-top:15px;">
      <a href="{{ url_for('main.index') }}">← Back to Home</a>
    </p>
  </div>

</body>
</html>
