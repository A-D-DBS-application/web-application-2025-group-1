<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AfriGuide | Dashboard</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: "Poppins", sans-serif; 
    }
    body {
      background: linear-gradient(135deg, #f4a261, #2a9d8f);
      display: flex; 
      justify-content: center; 
      align-items: center;
      height: 100vh; 
      color: #fff;
    }
    .container {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 50px;
      border-radius: 16px;
      text-align: center;
      width: 400px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 20px;
    }
    .btn {
      display: inline-block;
      background: #264653;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn:hover { background: #1f3b47; }

    .flash-success {
      background-color: rgba(34, 139, 34, 0.85); /* ⬅️ nieuwe groene kleur */
      color: #f0fff0;
      padding: 10px 15px;
      margin-bottom: 15px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          {% if category == 'success' %}
            <div class="flash-success">{{ message }}</div>
          {% endif %}
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <h1>Dashboard</h1>
    <p>Deze pagina is nog in opbouw 🚧</p>

    <a href="{{ url_for('main.logout') }}" class="btn">Uitloggen</a>
  </div>
</body>
</html>
